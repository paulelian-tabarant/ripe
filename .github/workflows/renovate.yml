name: Renovate

on:
  schedule:
    # Runs weekly; renovate.json's own per-rule schedules decide what's actually due
    # (minor/patch weekly, major monthly), so a weekly cron covers both.
    - cron: '0 4 * * 1'
  workflow_dispatch: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.2.1
        with:
          configurationFile: renovate.json
          token: '${{ secrets.RENOVATE_TOKEN }}'
        env:
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
