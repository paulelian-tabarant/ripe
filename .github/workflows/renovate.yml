name: Renovate

on:
  schedule:
    # Daily. What gets *created* is gated by the `schedule` fields in renovate.json (weekly for
    # minor/patch + lock file maintenance, monthly for majors); the other days only rebase and
    # automerge existing PRs, so a lockfile conflict heals within a day.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.7
        with:
          token: '${{ secrets.RENOVATE_TOKEN }}'
        env:
          RENOVATE_REPOSITORIES: '${{ github.repository }}'
